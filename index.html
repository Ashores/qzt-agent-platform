<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>群智通智能体平台</title>
<style>
/* 布局：左侧固定导航 + 右侧工作区；入口为全屏身份选择 */
:root{
  --bg:#f4f7fc; --surface:#ffffff; --surface2:#f0f4fb; --line:#e3e9f3; --fg:#18233a; --muted:#66728a; --faint:#9aa5b8;
  --accent:#2f6bf0; --accent-soft:#e8efff; --accent-fg:#ffffff;
  --ok:#17a36b; --ok-soft:#e3f6ee; --warn:#d98a12; --warn-soft:#fdf2df; --bad:#d64545; --bad-soft:#fde8e8; --vio:#7a5af5; --vio-soft:#efeaff;
  --shadow:0 1px 2px rgba(24,35,58,.04),0 4px 14px rgba(24,35,58,.05);
  --f-body:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1420; --surface:#171e2d; --surface2:#1d2638; --line:#28324a; --fg:#e6ebf5; --muted:#98a3ba; --faint:#6b768e;
  --accent:#5b8cff; --accent-soft:#1e2c4f; --accent-fg:#ffffff;
  --ok:#3cc98e; --ok-soft:#173528; --warn:#f0a93a; --warn-soft:#3a2c14; --bad:#f06b6b; --bad-soft:#3d1c1f; --vio:#a08bff; --vio-soft:#2a2350;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1420; --surface:#171e2d; --surface2:#1d2638; --line:#28324a; --fg:#e6ebf5; --muted:#98a3ba; --faint:#6b768e;
  --accent:#5b8cff; --accent-soft:#1e2c4f; --accent-fg:#ffffff;
  --ok:#3cc98e; --ok-soft:#173528; --warn:#f0a93a; --warn-soft:#3a2c14; --bad:#f06b6b; --bad-soft:#3d1c1f; --vio:#a08bff; --vio-soft:#2a2350;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}

/* ---------- 身份选择 ---------- */
#login{min-height:100%;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(1200px 500px at 15% -10%,var(--accent-soft),transparent 60%),var(--bg)}
.login-in{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:11px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.brand b{display:block;font-size:17px;color:var(--accent)}
.brand small{display:block;font-size:11px;letter-spacing:.08em;color:var(--muted);font-family:var(--f-mono)}
.login-head h1{font-size:28px;font-weight:700}
.login-head p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.role-groups{display:flex;flex-direction:column;gap:22px}
.rg-title{font-size:12px;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.role-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.role-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.role-card .rc-top{display:flex;align-items:center;gap:10px}
.role-card .av{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.role-card b{font-size:15px}
.role-card .dept{font-size:12px;color:var(--muted)}
.role-card p{margin:0;font-size:13px;color:var(--muted)}
.role-card .rc-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);border-top:1px dashed var(--line);padding-top:8px}
.login-note{font-size:12px;color:var(--faint)}

/* ---------- 主框架 ---------- */
#app{display:flex;height:100%}
#nav{width:228px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-top:18px}
#nav .brand{padding:0 18px 16px;border-bottom:1px solid var(--line)}
.nav-scroll{flex:1;overflow:auto;padding:10px 10px}
.nav-sec{font-size:12px;color:var(--faint);padding:12px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;color:var(--fg)}
.nav-item svg{width:17px;height:17px;color:var(--muted);flex:none}
.nav-item:hover{background:var(--surface2)}
.nav-item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item.on svg{color:var(--accent)}
.nav-item .tag{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .tag.n{background:var(--bad);color:#fff}
.me{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.me .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.me b{display:block;font-size:13px}.me span{font-size:12px;color:var(--muted)}
.me button{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:7px;font-size:12px;padding:4px 8px;white-space:nowrap}
#main{flex:1;min-width:0;overflow:auto}
.page{padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1440px}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:26px;font-weight:700}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph .grow{flex:1;min-width:0}
.mobile-top{display:none}

/* 通用组件 */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-fg)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:6px;font-weight:500;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-vio{background:var(--vio-soft);color:var(--vio)}.p-acc{background:var(--accent-soft);color:var(--accent)}.p-mute{background:var(--surface2);color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:15px;font-weight:600}
.panel-h .r{margin-left:auto}
.panel-b{padding:14px 16px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 0 10px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);font-weight:600;border-color:var(--accent)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .count{color:var(--muted)}.toolbar .count b{color:var(--fg)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-left:auto;min-width:0}
.search input{border:0;background:none;outline:none;color:var(--fg);width:200px;max-width:100%}
.search svg{width:15px;height:15px;color:var(--faint)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi .d{font-size:12px;margin-top:2px}
.up{color:var(--ok)}.down{color:var(--bad)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* 智能体卡片（参考截图） */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative}
.card::before{content:"";height:3px;background:var(--accent);opacity:.75}
.card.off{opacity:.62}
.card.off::before{background:var(--faint)}
.card-b{padding:14px 16px 0;display:flex;flex-direction:column;gap:10px;flex:1}
.c-top{display:flex;gap:10px;align-items:flex-start}
.c-ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;flex:none}
.c-name{min-width:0;flex:1}
.c-name b{font-size:15px}
.c-name .mono{color:var(--muted);margin-left:6px;font-size:11px}
.c-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.c-desc{margin:0;font-size:13px;color:var(--muted);min-height:40px}
.c-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.c-meta .chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;padding:0 6px;border:1px solid var(--line);border-radius:5px;color:var(--muted);white-space:nowrap}
.c-foot{display:flex;align-items:center;gap:4px;padding:10px 12px 12px 10px}
.ic-btn{border:0;background:none;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.ic-btn:hover{background:var(--surface2);color:var(--fg)}
.ic-btn svg{width:16px;height:16px}
.c-foot .btn{margin-left:auto}
.switch{width:38px;height:22px;border-radius:11px;background:var(--line);border:0;position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}.switch.on::after{left:19px}
.switch[disabled]{cursor:default}

/* 工作台 */
.hello{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:18px 20px;margin-bottom:16px}
.hello h2{font-size:20px}
.hello p{margin:2px 0 0;color:var(--muted)}
.todo{display:flex;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.todo:last-child{border-bottom:0}
.todo .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.todo .t{flex:1;min-width:0}
.todo .t small{display:block;color:var(--muted);font-size:12px}
.quick{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.quick:last-child{border-bottom:0}
.quick .c-ic{width:34px;height:34px;font-size:14px;border-radius:9px}
.quick .t{flex:1;min-width:0}.quick .t small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.flow span{background:var(--surface2);border:1px solid var(--line);padding:3px 8px;border-radius:6px;color:var(--fg)}

/* 对话 */
.chat{display:grid;grid-template-columns:260px minmax(0,1fr);height:calc(100vh - 150px);min-height:480px}
.chat-list{border-right:1px solid var(--line);overflow:auto}
.chat-list button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
.chat-list button.on{background:var(--accent-soft)}
.chat-list .c-ic{width:32px;height:32px;font-size:13px;border-radius:8px}
.chat-list small{display:block;color:var(--muted);font-size:12px}
.chat-main{display:flex;flex-direction:column;min-width:0}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;padding:10px 14px;border-radius:12px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .src{display:block;margin-top:8px;font-size:11px;color:var(--muted)}
.suggest{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 10px}
.suggest button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:4px 12px;font-size:12px;color:var(--muted)}
.suggest button:hover{color:var(--accent);border-color:var(--accent)}
.composer{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--surface);color:var(--fg)}

/* 订单入库 */
.split{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px}
.q-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;border-left:3px solid transparent;background:none;border-top:0;border-right:0;text-align:left}
.q-item.on{background:var(--accent-soft);border-left-color:var(--accent)}
.q-item .ch{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.q-item .t{flex:1;min-width:0}.q-item small{display:block;color:var(--muted);font-size:12px}
.raw{background:var(--surface2);border:1px dashed var(--line);border-radius:8px;padding:12px;white-space:pre-wrap;font-size:13px;color:var(--muted)}
.conf{display:inline-block;width:60px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;margin-right:6px;overflow:hidden}
.conf i{display:block;height:100%;background:var(--ok)}
.miss td{background:var(--bad-soft)}
.steps{display:flex;gap:0;flex-wrap:wrap;margin-bottom:14px}
.steps div{flex:1;min-width:110px;font-size:12px;color:var(--muted);padding:8px 10px;border-top:3px solid var(--line)}
.steps div.done{border-color:var(--ok);color:var(--fg)}
.steps div.cur{border-color:var(--accent);color:var(--accent);font-weight:600}

/* 短驳 */
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.plan{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:10px;text-align:left}
.plan.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.plan h4{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.plan dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:0}
.plan dt{font-size:12px;color:var(--muted)}.plan dd{margin:0;font-weight:600;font-size:16px}
.cons{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.cons .ok{color:var(--ok)}.cons .no{color:var(--warn)}
.routes svg{width:100%;height:auto;display:block}

/* 柱状 */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar .n{text-align:right;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);z-index:50}

@media (max-width:1100px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.split{grid-template-columns:minmax(0,1fr)}.plans{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  #app{flex-direction:column;height:auto;min-height:100%}
  #nav{display:none;width:100%;border-right:0;border-bottom:1px solid var(--line)}
  #nav.open{display:flex}
  #nav .brand{display:none}
  .mobile-top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
  .mobile-top b{color:var(--accent)}
  .mobile-top .btn{margin-left:auto}
  #main{overflow:visible}
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .chat{grid-template-columns:minmax(0,1fr);height:auto}
  .chat-list{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .chat-list button{flex:none;width:auto;border-bottom:0}
  .msgs{min-height:360px}
  .search{margin-left:0;width:100%}.search input{width:100%}
  .bar{grid-template-columns:90px minmax(0,1fr) 56px}
}

/* ---------- 平台原理（客户讲解） ---------- */
.ex-tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:18px}
.ex-tab{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0}
.ex-tab i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);flex:none}
.ex-tab span{font-size:13px;line-height:1.3;min-width:0}
.ex-tab:hover{border-color:var(--accent)}
.ex-tab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.ex-tab.on i{background:var(--accent);color:var(--accent-fg)}
.ex-lead{padding:22px 24px;margin-bottom:16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,var(--accent-soft),var(--surface) 70%)}
.ex-lead h2{font-size:22px;font-weight:700}
.ex-lead p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.ex-lead .big{font-size:40px;line-height:1;flex:none}
.ex-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ex-g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.ex-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ex-card{padding:16px;display:flex;flex-direction:column;gap:8px}
.ex-card .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px}
.ex-card b{font-size:15px}
.ex-card p{margin:0;font-size:13px;color:var(--muted)}
.ex-sec-t{font-size:16px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.ex-sec-t small{font-weight:400;font-size:12px;color:var(--muted)}
/* 分层架构 */
.ex-arch{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:14px;border:2px dashed var(--ok);border-radius:16px;padding:30px 16px 16px;position:relative}
.ex-arch::before{content:"企业内网 · 私有化部署";position:absolute;top:-11px;left:18px;background:var(--bg);color:var(--ok);font-size:12px;font-weight:600;padding:0 8px}
.ex-layers{display:flex;flex-direction:column;gap:0}
.ex-layer{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);position:relative}
.ex-layer + .ex-down{height:22px;display:flex;justify-content:center;align-items:center;color:var(--faint);font-size:12px;gap:6px}
.ex-layer .nm b{display:block;font-size:15px}
.ex-layer .nm span{font-size:12px;color:var(--muted)}
.ex-layer .bd{display:flex;flex-direction:column;gap:6px;min-width:0}
.ex-layer .bd p{margin:0;font-size:13px;color:var(--muted)}
.ex-chips{display:flex;gap:6px;flex-wrap:wrap}
.ex-chip{font-size:12px;padding:2px 9px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.ex-layer.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ex-layer.gw{border-color:var(--warn)}
.ex-side{border-radius:12px;background:var(--vio-soft);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.ex-side b{color:var(--vio);font-size:15px}
.ex-side p{margin:0;font-size:13px;color:var(--muted)}
.bar-l{width:4px;align-self:stretch;border-radius:2px;position:absolute;left:0;top:12px;bottom:12px}
/* 步骤播放器 */
.ex-ask{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;margin-bottom:14px}
.ex-ask .q{background:var(--accent);color:var(--accent-fg);padding:10px 14px;border-radius:12px 12px 12px 4px;font-size:14px}
.ex-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;margin-bottom:14px;position:relative}
.ex-step{border:0;background:none;padding:0 4px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}
.ex-step::before{content:"";position:absolute;top:17px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.ex-step:first-child::before{display:none}
.ex-step.done::before,.ex-step.cur::before{background:var(--accent)}
.ex-step i{font-style:normal;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface);border:2px solid var(--line);color:var(--muted);position:relative;z-index:1;transition:all .2s}
.ex-step.done i{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.ex-step.cur i{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);transform:scale(1.12)}
.ex-step span{font-size:13px;color:var(--muted)}
.ex-step.cur span{color:var(--fg);font-weight:600}
.ex-detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.ex-detail > div{padding:18px 20px}
.ex-detail > div + div{border-left:1px solid var(--line);background:var(--surface2);border-radius:0 12px 12px 0}
.ex-detail h3{font-size:18px;margin-bottom:6px}
.ex-detail p{margin:0 0 10px;color:var(--muted)}
.ex-who{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ex-screen{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.ex-screen .lbl{font-size:11px;color:var(--faint);letter-spacing:.06em}
.ex-screen .row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.ex-screen .row:last-child{border-bottom:0;padding-bottom:0}
.ex-screen .row span:first-child{color:var(--muted)}
.ex-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
/* 横向流程 */
.ex-flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:4px}
.ex-node{flex:1;min-width:128px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 12px;display:flex;flex-direction:column;gap:6px;text-align:center;align-items:center}
.ex-node .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px}
.ex-node b{font-size:14px}
.ex-node p{margin:0;font-size:12px;color:var(--muted)}
.ex-node.human{border-color:var(--warn);background:var(--warn-soft)}
.ex-node.human .ic{background:var(--warn);color:#fff}
.ex-arrow{flex:none;width:26px;display:grid;place-items:center;color:var(--faint);font-size:18px}
.ex-who-ai{font-size:11px;padding:0 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.ex-who-hu{font-size:11px;padding:0 6px;border-radius:5px;background:var(--warn);color:#fff}
.ex-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
/* 前后对比 */
.ex-vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.ex-vs .panel{padding:16px}
.ex-vs h4{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.ex-vs ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:5px}
.ex-vs .before{background:var(--surface2)}
.ex-vs .after{border-color:var(--ok)}
.ex-metric{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.ex-metric div{display:flex;flex-direction:column}
.ex-metric b{font-size:22px}
.ex-metric span{font-size:12px;color:var(--muted)}
.ex-note{font-size:12px;color:var(--faint);margin-top:8px}
/* 示例：原文 → 字段 */
.ex-sample{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1.2fr);gap:0;align-items:center}
.ex-sample .raw{font-size:13px}
.ex-sample .mid{text-align:center;color:var(--faint);font-size:20px}
.ex-sample table td,.ex-sample table th{padding:7px 10px}
mark.ex-m{background:var(--accent-soft);color:var(--accent);padding:0 2px;border-radius:3px}
/* 两种能力分工 */
.ex-duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.ex-duo > div{padding:16px 18px}
.ex-duo > div + div{border-left:1px solid var(--line)}
.ex-duo h4{margin:0 0 8px;font-size:15px;display:flex;gap:8px;align-items:center}
.ex-duo ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.ex-map svg{width:100%;height:auto;display:block}
.ex-map .road{stroke:var(--line);stroke-width:1}
.ex-map .pt{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.ex-map .dc{fill:var(--fg)}
.ex-map .lbl{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.ex-map .r1{stroke:var(--bad);fill:none;stroke-width:2;stroke-dasharray:4 3;opacity:.8}
.ex-map .r2{stroke:var(--accent);fill:none;stroke-width:2.4}
.ex-map .r3{stroke:var(--ok);fill:none;stroke-width:2.4}
.ex-map .r4{stroke:var(--vio);fill:none;stroke-width:2.4}
/* 安全 */
.ex-net{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:18px;align-items:center}
.ex-in{border:2px solid var(--ok);border-radius:16px;padding:28px 16px 16px;position:relative;background:var(--ok-soft)}
.ex-in::before{content:"🔒 企业内网（公司自己的机房 / 私有云）";position:absolute;top:-12px;left:16px;background:var(--ok);color:#fff;font-size:12px;font-weight:600;padding:2px 10px;border-radius:6px}
.ex-in-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ex-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.ex-box b{display:block;font-size:14px}
.ex-box span{color:var(--muted);font-size:12px}
.ex-out{border:2px dashed var(--bad);border-radius:14px;padding:16px;text-align:center;color:var(--muted);font-size:13px;position:relative}
.ex-out b{display:block;color:var(--fg);font-size:14px;margin-bottom:4px}
.ex-out .x{font-size:28px;color:var(--bad);line-height:1;margin-bottom:6px}
.ex-mx td,.ex-mx th{text-align:center}
.ex-mx td:first-child,.ex-mx th:first-child{text-align:left}
/* 审批 */
.ex-lv{padding:16px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--line)}
.ex-lv .t{display:flex;align-items:center;gap:8px}
.ex-lv .t b{font-size:16px}
.ex-lv p{margin:0;font-size:13px;color:var(--muted)}
.ex-lv .eg{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:8px 10px}
.ex-apcard{max-width:520px;padding:0;overflow:hidden}
.ex-apcard .hd{padding:12px 16px;background:var(--warn-soft);display:flex;align-items:center;gap:8px;font-weight:600}
.ex-apcard .bd{padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.ex-apcard .row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px}
.ex-apcard .row span:first-child{color:var(--muted)}
.ex-apcard .ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ex-log{font-family:var(--f-mono);font-size:12px;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.ex-log .ok{color:var(--ok)}
.ex-foot{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.ex-entry{display:flex;align-items:center;gap:14px;padding:14px 18px;flex-wrap:wrap;border-color:var(--accent);background:linear-gradient(120deg,var(--accent-soft),var(--surface) 75%)}
.ex-entry .t{flex:1;min-width:200px}
.ex-entry .t b{font-size:15px}.ex-entry .t p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.ex-standalone{max-width:1180px;margin:0 auto}
.ex-standalone .ex-top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.ex-standalone .ex-top .btn{margin-left:auto}
@media (max-width:1100px){
  .ex-tabs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ex-g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ex-arch,.ex-net{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .ex-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ex-g3,.ex-g2,.ex-vs,.ex-duo,.ex-detail{grid-template-columns:minmax(0,1fr)}
  .ex-duo > div + div,.ex-detail > div + div{border-left:0;border-top:1px solid var(--line);border-radius:0 0 12px 12px}
  .ex-layer{grid-template-columns:minmax(0,1fr)}
  .ex-steps{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:14px}
  .ex-step:nth-child(4)::before{display:none}
  .ex-sample{grid-template-columns:minmax(0,1fr)}
  .ex-sample .mid{transform:rotate(90deg)}
  .ex-in-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ex-flow{flex-direction:column}
  .ex-arrow{width:auto;height:22px;transform:rotate(90deg)}
  .ex-node{min-width:0}
  .ex-lead .big{display:none}
}
.ex-tabs{grid-template-columns:repeat(5,minmax(0,1fr))}
/* 架构图 */
.ex-phsel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ex-phsel button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:4px 14px;font-size:13px}
.ex-phsel button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.ex-phsel span{font-size:12px;color:var(--faint);margin-left:6px}
.ex-ad{display:flex;flex-direction:column;gap:10px;border:2px dashed var(--ok);border-radius:16px;padding:26px 14px 14px;position:relative}
.ex-ad::before{content:"企业内网 · 私有化部署";position:absolute;top:-11px;left:18px;background:var(--bg);color:var(--ok);font-size:12px;font-weight:600;padding:0 8px}
.ex-ad-mid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr) minmax(0,1fr);gap:10px}
.ex-ad-core{display:flex;flex-direction:column;gap:10px;border:1px solid var(--accent);border-radius:12px;padding:10px;background:var(--accent-soft)}
.ex-ad-side{display:flex}.ex-ad-side .ex-ab{flex:1}
.ex-ab{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ex-ab .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ex-ab .hd b{font-size:14px}.ex-ab .hd span{font-size:12px;color:var(--muted)}
.ex-ab .dot{width:9px;height:9px;border-radius:3px;align-self:center;flex:none}
.ex-chip em{font-style:normal;font-size:10px;margin-left:5px;padding:0 4px;border-radius:4px;background:var(--vio-soft);color:var(--vio)}
.ex-chip.dim{opacity:.35}
.ex-chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
/* 分期卡片 */
.ex-phc{text-align:left;padding:16px;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--pc)}
.ex-phc.on{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--pc)}
.ex-phc .t{display:flex;align-items:center;gap:8px}.ex-phc .t b{font-size:15px}
.ex-phn{background:var(--pc);color:#fff;font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px}
.ex-phc p{margin:0;font-size:13px;color:var(--muted)}
.ex-phc .lbl{font-size:11px;color:var(--faint);letter-spacing:.06em;margin-top:6px}
.ex-phc ul{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:2px}
/* 实时监听 */
.ex-live{display:grid;grid-template-columns:260px minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:start}
.ex-live .btn{justify-content:flex-start;white-space:normal;text-align:left}
.ex-dot{width:10px;height:10px;border-radius:50%;flex:none}
.ex-rec{font-size:12px;color:var(--ok);font-weight:600}
.ex-ev{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 14px;animation:exIn .35s ease}
.ex-ev.on{background:var(--accent-soft)}
.ex-ev .ch{width:28px;height:28px;border-radius:8px;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.ex-ev .t{flex:1;min-width:0}.ex-ev .t b{font-size:13px;display:block}.ex-ev small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-prog{display:flex;gap:3px;margin-top:4px}.ex-prog i{width:18px;height:4px;border-radius:2px;background:var(--line)}.ex-prog i.on{background:var(--accent)}
@keyframes exIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (max-width:1100px){.ex-live{grid-template-columns:minmax(0,1fr)}.ex-ad-mid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1100px){.ex-tabs{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.ex-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.ex-ev{animation:none}}

/* ---------- 动效：依次浮现 ---------- */
@keyframes exUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.ex-anim > *,.ex-anim .ex-g2 > *,.ex-anim .ex-g3 > *,.ex-anim .ex-g4 > *,.ex-anim .ex-flow > *,.ex-anim .dk-agenda > *,.ex-anim .dk-nums > *{animation:exUp .6s cubic-bezier(.2,.7,.2,1) both}
.ex-anim > *:nth-child(2){animation-delay:.08s}.ex-anim > *:nth-child(3){animation-delay:.16s}.ex-anim > *:nth-child(4){animation-delay:.24s}
.ex-anim > *:nth-child(5){animation-delay:.32s}.ex-anim > *:nth-child(6){animation-delay:.4s}.ex-anim > *:nth-child(n+7){animation-delay:.46s}
.ex-anim :is(.ex-g2,.ex-g3,.ex-g4,.ex-flow,.dk-agenda,.dk-nums) > *:nth-child(2){animation-delay:.2s}
.ex-anim :is(.ex-g2,.ex-g3,.ex-g4,.ex-flow,.dk-agenda,.dk-nums) > *:nth-child(3){animation-delay:.28s}
.ex-anim :is(.ex-g2,.ex-g3,.ex-g4,.ex-flow,.dk-agenda,.dk-nums) > *:nth-child(4){animation-delay:.36s}
.ex-anim :is(.ex-g2,.ex-g3,.ex-g4,.ex-flow,.dk-agenda,.dk-nums) > *:nth-child(5){animation-delay:.44s}
.ex-anim :is(.ex-g2,.ex-g3,.ex-g4,.ex-flow,.dk-agenda,.dk-nums) > *:nth-child(6){animation-delay:.52s}
.ex-anim :is(.ex-g2,.ex-g3,.ex-g4,.ex-flow,.dk-agenda,.dk-nums) > *:nth-child(7){animation-delay:.6s}
.ex-anim :is(.ex-g2,.ex-g3,.ex-g4,.ex-flow,.dk-agenda,.dk-nums) > *:nth-child(8){animation-delay:.68s}
.ex-anim :is(.ex-g2,.ex-g3,.ex-g4,.ex-flow,.dk-agenda,.dk-nums) > *:nth-child(n+9){animation-delay:.76s}
.ex-card,.ex-node,.ex-phc,.ex-ab{transition:transform .2s,box-shadow .2s,border-color .2s,opacity .25s}
.ex-card:hover,.ex-node:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(24,35,58,.1)}

/* ---------- 架构图：悬停说明 + 数据流 ---------- */
.ex-flowbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ex-flowcap{font-size:13px;color:var(--muted)}
.ex-flowcap.pop{color:var(--fg);font-weight:600;animation:exUp .4s ease both}
.ex-ab{position:relative}
.ex-ab:hover,.ex-ab:focus-visible{border-color:var(--accent);z-index:5}
.ex-tip{position:absolute;left:12px;right:12px;bottom:calc(100% + 8px);background:var(--fg);color:var(--bg);font-size:12.5px;line-height:1.55;padding:10px 12px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .18s,transform .18s;z-index:6;min-width:200px}
.ex-tip::after{content:"";position:absolute;top:100%;left:24px;border:6px solid transparent;border-top-color:var(--fg)}
.ex-ab:hover .ex-tip,.ex-ab:focus-visible .ex-tip{opacity:1;transform:none}
.ex-archwrap.flowing .ex-ab{opacity:.38}
.ex-archwrap.flowing .ex-ab.flow-done{opacity:.75;border-color:var(--accent)}
.ex-archwrap.flowing .ex-ab.flow-on{opacity:1;border-color:var(--accent);transform:scale(1.02);box-shadow:0 0 0 4px var(--accent-soft),0 0 28px color-mix(in srgb,var(--accent) 35%,transparent);animation:exPulse 1.7s ease infinite}
@keyframes exPulse{0%,100%{box-shadow:0 0 0 4px var(--accent-soft),0 0 18px color-mix(in srgb,var(--accent) 25%,transparent)}50%{box-shadow:0 0 0 7px var(--accent-soft),0 0 34px color-mix(in srgb,var(--accent) 45%,transparent)}}
.ex-entry .btn{flex:none}

/* ---------- 全屏演讲模式 ---------- */
.ex-deck{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column}
.dk-top{display:flex;align-items:center;gap:10px;padding:12px max(20px,env(safe-area-inset-right,0px)) 12px max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.dk-top b{color:var(--accent);font-size:14px}
.dk-crumb{font-size:13px;color:var(--muted);margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dk-acts{margin-left:auto;display:flex;gap:6px;flex:none}
.dk-acts button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:13px}
.dk-acts button:hover{border-color:var(--accent);color:var(--accent)}
.dk-stage{flex:1;overflow:auto;padding:36px max(24px,env(safe-area-inset-left,0px)) 40px}
.dk-stage.cv{padding:0;display:flex}
.dk-slide{max-width:1240px;margin:0 auto;animation:dkIn .55s cubic-bezier(.2,.7,.2,1) both;width:100%}
.dk-slide.back{animation-name:dkBack}

/* ================= 菜单（按角色） ================= */
function navFor(r){
  const w = [{id:'home',n:'工作台',i:'home'},{id:'chat',n:'对话',i:'chat'},{id:'agents',n:'智能体',i:'agent'}];
  const biz = [];
  if(['order','dispatch','admin','mgmt'].includes(r)) biz.push({id:'orderin',n:'订单自动入库',i:'order',tag:'试点一'});
  if(['dispatch','admin','mgmt'].includes(r)) biz.push({id:'route',n:'短驳路线优化',i:'route',tag:'试点二'});
  if(r==='mgmt'||r==='admin') biz.push({id:'coop',n:'每日协同',i:'sync',tag:'二期'});
  if(myApprovals().length) biz.push({id:'approve',n:'审批中心',i:'check',count:true});
  const cfg = [{id:'kb',n:'知识库',i:'book'}];
  if(r==='mgmt'||r==='admin') cfg.push({id:'usage',n:'用量与效果',i:'chart'});
  const sys = r==='admin' ? [{id:'users',n:'用户与角色',i:'users'},{id:'plugins',n:'插件',i:'plug'},{id:'connectors',n:'Bridge 连接器',i:'link'},{id:'models',n:'模型网关',i:'cpu'},{id:'audit',n:'审计与 Trace',i:'shield'}] : [];
  return [['工作区',w],['业务',biz],['资源',cfg],['系统',sys],['了解平台',[{id:'explain',n:'平台原理',i:'bulb'}]]].filter(s=>s[1].length);
}

function go(p,extra){exStop();exAutoStop();exFlowStop();if(p==='explain')S.exAnim=true;S.page=p;Object.assign(S,extra||{});$('#nav').classList.remove('open');renderApp();$('#main').scrollTop=0;window.scrollTo(0,0)}

function pAgents(){
  let list = myAgents();

  if(S.agentTab==='mine') list=list.filter(a=>a.st!=='plan');
  if(S.q) list=list.filter(a=>(a.name+a.desc).includes(S.q));
  const tabs=[['mine','我的智能体'],['pilot','试点'],['plan','规划中'],['all','全部']];
  return ph('智能体', isAdmin()?'管理平台上所有智能体，启停后对相应角色立即生效。':`以下是「${role().name}」岗位可用的智能体。`,

  return `<div class="card ${on?'':'off'}"><div class="card-b">
    <div class="c-top"><div class="c-ic" style="background:${a.c}">${a.ch}</div>
      <div class="c-name"><b>${a.name}</b><span class="mono">v${a.v}</span>
        <div class="c-tags">${on?stPill(a):'<span class="pill p-mute">已停用</span>'}${a.def?'<span class="pill p-warn">默认</span>':''}${a.batch?`<span class="pill p-vio">${a.batch}</span>`:''}<span class="pill p-acc">${a.lv}</span></div></div>
      ${isAdmin()?`<button class="switch ${on?'on':''}" type="button" aria-label="启停" data-sw="${a.id}"></button>`:''}</div>

  </div><div class="c-foot">
    <button class="ic-btn" type="button" title="复制" data-toast="已复制智能体链接">${ico('copy')}</button>
    ${isAdmin()?`<button class="ic-btn" type="button" title="编辑" data-toast="已在 Dify 中打开编排（演示）">${ico('edit')}</button>`:''}
    <button class="ic-btn" type="button" title="分享" data-toast="已生成分享链接（钉钉 / 企业微信）">${ico('share')}</button>
    ${a.page?`<button class="btn sm" type="button" data-go="${a.page}" ${on?'':'disabled'}>打开</button>`:`<button class="btn sm" type="button" data-chat="${a.id}" ${on?'':'disabled'}>对话</button>`}
  </div></div>`;
}

/* ---------- 对话 ---------- */

  const list = myAgents().filter(a=>S.enabled[a.id]);
  if(!S.chatAgent || !list.find(a=>a.id===S.chatAgent)) S.chatAgent = (list.find(a=>a.demo && !a.roles.includes('*'))||list[0]).id;
  const a = AGENTS.find(x=>x.id===S.chatAgent);
  const msgs = S.chats[a.id] || [{r:'a',t:`你好，我是「${a.name}」。${a.desc}`}];

   `<div class="panel chat"><div class="chat-list">${list.map(x=>`<button type="button" class="${x.id===a.id?'on':''}" data-pick="${x.id}"><div class="c-ic" style="background:${x.c}">${x.ch}</div><div style="min-width:0"><b>${x.name}</b><small>${x.kind} · ${x.lv}</small></div></button>`).join('')}</div>

/* ---------- DeepSeek 接入（OpenAI 兼容接口） ---------- */

if(!LLM.key) LLM.key = DEFAULT_KEY;

  const r = role();
  const who = a.roles.includes('*') ? '公司全体员工' : a.roles.map(x=>ROLES.find(y=>y.id===x).name).join('、');
  return [
    `你是「群智通」内部智能体平台上的「${a.name}」。群智通是一家汽车零部件第三方物流企业，主营主机厂 VMI 仓储、短驳与干线运输、JIT 配送，正在从 3PL 向 4PL 转型。`,

async function callLLM(a, history){
  const url = LLM.base.replace(/\/+$/,'') + '/chat/completions';
  const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 60000);
  try{
    const res = await fetch(url, {method:'POST', signal:ctl.signal, headers:{'Content-Type':'application/json','Authorization':'Bearer '+LLM.key},
      body: JSON.stringify({model:LLM.model, temperature:0.4, messages:[{role:'system',content:systemPrompt(a)}, ...history]})});
    if(!res.ok){ let t=''; try{ t=(await res.json()).error?.message||''; }catch(e){} throw new Error('HTTP '+res.status+(t?' · '+t:'')); }
    const j = await res.json();
    return {text:(j.choices?.[0]?.message?.content||'').trim(), usage:j.usage};
  } finally { clearTimeout(tm); }
}
function mockReply(a, text, demoIdx){
  const d = demoIdx!=null ? a.demo[demoIdx] : (a.demo||[]).find(x=>x[0]===text);
  return d ? {r:'a',t:d[1],src:d[2]} : {r:'a',t:`（演示）已收到。正式环境中，「${a.name}」会调用 ${a.tools.join('、')} 处理这个问题，结果附带出处和 Trace 编号。`,src:'trace-'+Math.random().toString(16).slice(2,8)};
}
function scrollMsgs(){ const m=$('#msgs'); if(m) m.scrollTop=m.scrollHeight; }
async function sendChat(text, demoIdx){
  const a = AGENTS.find(x=>x.id===S.chatAgent);
  const arr = S.chats[a.id] || (S.chats[a.id]=[{r:'a',t:`你好，我是「${a.name}」。${a.desc}`}]);
  arr.push({r:'u',t:text});
  if(!LLM.key){ arr.push(mockReply(a,text,demoIdx)); renderPage(); scrollMsgs(); return; }
  const history = arr.slice(1).filter(m=>!m.err).slice(-12).map(m=>({role:m.r==='u'?'user':'assistant', content:m.t}));
  const slot = {r:'a', t:'思考中…', pending:true}; arr.push(slot); renderPage(); scrollMsgs();
  try{
    const out = await callLLM(a, history);
    slot.t = out.text || '（模型没有返回内容）';
    slot.src = `DeepSeek · ${LLM.model}${out.usage?` · ${out.usage.total_tokens} tokens`:''}`;
  }catch(e){
    const m = mockReply(a,text,demoIdx);
    slot.t = m.t; slot.err = true;
    slot.src = `DeepSeek 调用失败（${e.name==='AbortError'?'超时':e.message||'网络被拦截'}），已显示演示回答`;
  }
  delete slot.pending;
  if(S.page==='chat' && S.chatAgent===a.id){ renderPage(); scrollMsgs(); }
}

/* ================= 事件绑定 ================= */
function bind(){
  const M=$('#main');
  M.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  if(S.page==='explain') bindExplain(M);
  M.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>go('chat',{chatAgent:b.dataset.chat}));
  M.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));
  M.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.agentTab=b.dataset.tab;renderPage()});
  const q=$('#agentQ'); if(q){q.oninput=()=>{S.q=q.value;renderPage();const n=$('#agentQ');n.focus();n.setSelectionRange(n.value.length,n.value.length)}}
  M.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{const id=b.dataset.sw;const a=AGENTS.find(x=>x.id===id);
    if(a.st==='plan'&&!S.enabled[id]){toast('该智能体在二期规划中，尚未上线');return}
    S.enabled[id]=!S.enabled[id];toast(`${a.name} 已${S.enabled[id]?'启用':'停用'}`);renderPage()});
  M.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{S.chatAgent=b.dataset.pick;renderPage()});
  M.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>{const a=AGENTS.find(x=>x.id===S.chatAgent);sendChat(a.demo[+b.dataset.ask][0],+b.dataset.ask)});
  const lb=$('#llmBtn'); if(lb) lb.onclick=()=>{S.llmOpen=!S.llmOpen;renderPage()};
  const lf=$('#llmForm'); if(lf){
    const read=()=>{LLM.key=$('#llmKey').value.trim();LLM.base=$('#llmBase').value.trim()||'https://api.deepseek.com';LLM.model=$('#llmModel').value;};
    lf.onsubmit=e=>{e.preventDefault();read();saveLLM();S.llmOpen=false;toast(LLM.key?'已保存，对话将调用 DeepSeek':'已切回演示模式');renderPage()};
    $('#llmTest').onclick=async()=>{read();const msg=$('#llmMsg');if(!LLM.key){msg.textContent='请先填写 API Key';return}
      msg.textContent='正在测试…';
      try{const o=await callLLM(AGENTS[0],[{role:'user',content:'用一句话回复：连接成功'}]);msg.innerHTML='<span style="color:var(--ok)">连接成功：</span>'+esc(o.text)}
      catch(e){msg.innerHTML='<span style="color:var(--bad)">连接失败：</span>'+esc(e.message||String(e))+'。如果是网络错误，通常是当前页面环境禁止访问外部接口，请用本地打开的版本或内网网关。'}};
    const lc=$('#llmClear'); if(lc) lc.onclick=()=>{LLM.key=DEFAULT_KEY;saveLLM();S.llmOpen=false;toast('已清除 Key，回到演示模式');renderPage()};
  }
  const f=$('#composer'); if(f){f.onsubmit=e=>{e.preventDefault();const v=$('#chatIn').value.trim();if(v)sendChat(v)}; const m=$('#msgs'); if(m) m.scrollTop=m.scrollHeight;}
  M.querySelectorAll('[data-ord]').forEach(b=>b.onclick=()=>{S.order=b.dataset.ord;renderPage()});
  M.querySelectorAll('[data-write]').forEach(b=>b.onclick=()=>{const no='SO-20261121-0'+(110+Object.keys(S.ordersDone).length);S.ordersDone[b.dataset.write]=no;toast(`已写入 OWTB：${no}（防重键已登记）`);renderApp()});
  const rs=$('#runSolve'); if(rs) rs.onclick=()=>{rs.disabled=true;rs.textContent='求解中…';setTimeout(()=>{S.planRun=true;S.plan='C';renderPage();toast('已生成 3 个候选方案，耗时 12.4 秒')},700)};
  M.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{S.plan=b.dataset.plan;renderPage()});
  const sp=$('#submitPlan'); if(sp) sp.onclick=()=>{S.approvals['AP-1094']=undefined;toast(`方案 ${S.plan} 已提交派车审批（AP-1094）`);};
  M.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{S.approvals[b.dataset.ap]=b.dataset.v;toast(b.dataset.v==='ok'?'已通过，Bridge 正在防重执行并留痕':'已驳回，已通知提交人');renderApp()});
}

function exMulti(){

   ${exSeqHTML(M.nodes,M.caps)}
   <div class="ex-rules">${[['🧊','同一份数据'],['📋','任务单交接'],['🔐','各守权限'],['✋','冲突交给人'],['🔁','出错可重试']].map(r=>`<span><i>${r[0]}</i>${r[1]}</span>`).join('')}</div>

function exReq(){

   `<div class="ex-steps">${EX_STEPS.map((x,j)=>`<button class="ex-step ${j<k?'done':j===k?'cur':''}" type="button" data-exstep="${j}"><i>${j+1}</i><span>${x.n}</span></button>`).join('')}</div>
    <div class="panel ex-detail2"><div class="l"><div class="ex-who">${s.who.map(w=>`<span class="${w[0]==='hu'?'ex-who-hu':'ex-who-ai'}">${w[1]}</span>`).join('')}<span class="pill p-mute">${s.ms}</span></div><h3>${s.t}</h3>
      <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" type="button" id="exPlay">${exTimer?'⏸ 暂停':'▶ 自动播放'}</button><button class="btn" type="button" data-exstep="${Math.min(5,k+1)}" ${k<5?'':'disabled'}>下一步 →</button></div></div>
      <div class="ex-screen">${s.s.map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div></div>
    ${exMore(`<p style="margin:0;color:var(--muted)">${s.d}</p>`,'这一步的详细说明')}`;
}

      ['邮件、微信群、照片自动汇集','OCR + 视觉模型读出文字，手写也能认','提取客户、料号、数量、时间、地点','缺项拦截、比对档案、查重复','专员对照原文一键确认','带防重编号写入，回执客户'])}
   <div class="ex-stats"><div><b>6→1</b><small>分钟 / 单（目标）</small></div><div><b>0</b><small>重复写入</small></div><div><b>100%</b><small>写入前人工确认</small></div></div>
